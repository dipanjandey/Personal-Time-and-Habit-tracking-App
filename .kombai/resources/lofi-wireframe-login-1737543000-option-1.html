<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Wireframe - Option 1: Classic Minimal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .title {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }
    .title h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .title p {
      font-size: 14px;
      color: #666;
    }
    .container {
      width: 100%;
      max-width: 380px;
    }
    .card {
      background: #fff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 32px;
      position: relative;
    }
    .logo-section {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: #ccc;
      border: 2px dashed #666;
      border-radius: 12px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #666;
    }
    .app-name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
    .welcome-text {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }
    .form-group {
      margin-bottom: 16px;
      position: relative;
    }
    .label {
      display: block;
      font-size: 14px;
      color: #333;
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      padding: 12px;
      border: 2px solid #999;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      background: #fff;
    }
    .input::placeholder {
      color: #999;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: #333;
      color: #fff;
    }
    .btn-outline {
      background: #fff;
      color: #333;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: #ccc;
    }
    .divider-text {
      padding: 0 12px;
      color: #999;
      font-size: 12px;
    }
    .toggle-text {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 20px;
    }
    .toggle-link {
      color: #333;
      font-weight: bold;
      text-decoration: underline;
    }
    .icon-placeholder {
      width: 18px;
      height: 18px;
      background: #ccc;
      border-radius: 4px;
      display: inline-block;
    }
    .reuse-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #4CAF50;
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      z-index: 10;
    }
    .new-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #FF9800;
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Option 1: Classic Minimal</h1>
    <p>Simple, clean login with email-first approach and social login as secondary</p>
  </div>

  <div class="container">
    <!-- REUSABLE: Card from src/components/ui/card.tsx -->
    <div class="card">
      <span class="reuse-badge" title="src/components/ui/card.tsx">[REUSE] Card</span>
      
      <div class="logo-section">
        <div class="logo-icon">[Icon]</div>
        <div class="app-name">Habit Tracker</div>
      </div>

      <div class="welcome-text">Sign in to continue</div>

      <!-- REUSABLE: Form with Input from src/components/ui/input.tsx -->
      <div class="form-group" style="position: relative;">
        <span class="reuse-badge" title="src/components/ui/label.tsx">[REUSE] Label</span>
        <label class="label">Email</label>
        <!-- REUSABLE: Input from src/components/ui/input.tsx -->
        <div style="position: relative;">
          <span class="reuse-badge" title="src/components/ui/input.tsx">[REUSE] Input</span>
          <input type="email" class="input" placeholder="you@example.com" />
        </div>
      </div>

      <div class="form-group" style="position: relative;">
        <span class="reuse-badge" title="src/components/ui/label.tsx">[REUSE] Label</span>
        <label class="label">Password</label>
        <div style="position: relative;">
          <span class="reuse-badge" title="src/components/ui/input.tsx">[REUSE] Input</span>
          <input type="password" class="input" placeholder="••••••••" />
        </div>
      </div>

      <!-- REUSABLE: Button from src/components/ui/button.tsx -->
      <div style="position: relative; margin-top: 24px;">
        <span class="reuse-badge" title="src/components/ui/button.tsx">[REUSE] Button</span>
        <button class="btn btn-primary">
          Sign In
        </button>
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or continue with</span>
        <div class="divider-line"></div>
      </div>

      <!-- REUSABLE: Button from src/components/ui/button.tsx -->
      <div style="position: relative;">
        <span class="reuse-badge" title="src/components/ui/button.tsx">[REUSE] Button</span>
        <button class="btn btn-outline">
          <span class="icon-placeholder"></span>
          Google
        </button>
      </div>

      <div class="toggle-text">
        Don't have an account? <span class="toggle-link">Sign up</span>
      </div>
    </div>
  </div>
</body>
</html>
